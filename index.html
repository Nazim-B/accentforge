<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AccentForge</title>
<meta name="theme-color" content="#0b0f14">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AccentForge">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="app-header">
  <span class="app-title">AccentForge</span>
</header>

<main id="app-root" class="app-root"></main>

<audio id="shared-audio" preload="auto" style="display:none"></audio>

<nav class="tab-bar">
  <button class="tab-btn" data-tab="warmup">
    <span class="tab-icon">🌬️</span><span>Разминка</span>
  </button>
  <button class="tab-btn" data-tab="library">
    <span class="tab-icon">📚</span><span>Книги</span>
  </button>
  <button class="tab-btn" data-tab="recordings">
    <span class="tab-icon">🎙️</span><span>Записи</span>
  </button>
  <button class="tab-btn" data-tab="stats">
    <span class="tab-icon">📊</span><span>Статистика</span>
  </button>
</nav>

<!-- Local pdf.js (no CDN — works fully offline once cached by the service worker) -->
<script src="vendor/pdf.min.js"></script>
<script>
  if (window.pdfjsLib) {
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'vendor/pdf.worker.min.js';
  }
</script>

<script src="js/db.js"></script>
<script src="js/warmup.js"></script>
<script src="js/segmenter.js"></script>
<script src="js/audioEngine.js"></script>
<script src="js/recorder.js"></script>
<script src="js/textExtractor.js"></script>
<script src="js/app.js"></script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch((err) => {
        console.warn('Service worker registration failed:', err);
      });
    });
  }
</script>

</body>
</html>
