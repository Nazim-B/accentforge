<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AccentForge</title>
<meta name="theme-color" content="#0b0f14">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AccentForge">
<link rel="stylesheet" href="styles.css">
<style>
  #debug-log {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0;
    max-height: 60vh;
    overflow-y: auto;
    background: #3a0d0d;
    color: #ffdcdc;
    font-family: monospace;
    font-size: 12px;
    padding: 12px;
    padding-top: calc(env(safe-area-inset-top, 0px) + 12px);
    z-index: 9999;
    white-space: pre-wrap;
    word-break: break-word;
  }
  #debug-log.visible { display: block; }
  #debug-log .debug-title { font-weight: bold; margin-bottom: 8px; }
  #debug-log .debug-close {
    display: block;
    margin-top: 10px;
    background: #ffdcdc;
    color: #3a0d0d;
    border: none;
    border-radius: 6px;
    padding: 8px 12px;
    font-weight: bold;
  }
</style>
</head>
<body>

<div id="debug-log">
  <div class="debug-title">⚠️ Обнаружена ошибка JavaScript — сфотографируйте этот экран и пришлите:</div>
  <div id="debug-log-content"></div>
  <button class="debug-close" onclick="document.getElementById('debug-log').classList.remove('visible')">Закрыть</button>
</div>

<script>
  // Global error catcher — since debugging without a Mac's Web Inspector isn't
  // possible on iOS, surface errors directly on screen instead of only in a
  // console nobody here can open.
  (function () {
    const logEl = document.getElementById('debug-log');
    const contentEl = document.getElementById('debug-log-content');
    function show(msg) {
      logEl.classList.add('visible');
      const line = document.createElement('div');
      line.style.marginBottom = '10px';
      line.style.borderBottom = '1px solid #ffdcdc55';
      line.style.paddingBottom = '8px';
      line.textContent = msg;
      contentEl.appendChild(line);
    }
    window.addEventListener('error', (e) => {
      show(`${e.message}\nФайл: ${e.filename}:${e.lineno}:${e.colno}`);
    });
    window.addEventListener('unhandledrejection', (e) => {
      show(`Promise rejection: ${e.reason && e.reason.stack ? e.reason.stack : e.reason}`);
    });
  })();
</script>

<header class="app-header">
  <span class="app-title">AccentForge</span>
</header>

<main id="app-root" class="app-root"></main>

<audio id="shared-audio" preload="auto" style="display:none"></audio>

<nav class="tab-bar">
  <button class="tab-btn" data-tab="warmup">
    <span class="tab-icon">🌬️</span><span>Разминка</span>
  </button>
  <button class="tab-btn" data-tab="library">
    <span class="tab-icon">📚</span><span>Книги</span>
  </button>
  <button class="tab-btn" data-tab="recordings">
    <span class="tab-icon">🎙️</span><span>Записи</span>
  </button>
  <button class="tab-btn" data-tab="stats">
    <span class="tab-icon">📊</span><span>Статистика</span>
  </button>
</nav>

<!-- Local pdf.js (no CDN — works fully offline once cached by the service worker) -->
<script src="vendor/pdf.min.js"></script>
<script>
  if (window.pdfjsLib) {
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'vendor/pdf.worker.min.js';
  }
</script>

<script src="js/db.js"></script>
<script src="js/warmup.js"></script>
<script src="js/segmenter.js"></script>
<script src="js/audioEngine.js"></script>
<script src="js/recorder.js"></script>
<script src="js/textExtractor.js"></script>
<script src="js/app.js"></script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch((err) => {
        console.warn('Service worker registration failed:', err);
      });
    });
  }
</script>

</body>
</html>
